# Configuration mypy du projet : `mypy .` depuis cos/ (job mypy de .gitlab-ci.standards.yml).
[mypy]
# Les libs internes (bp2i_airflow_library, bp2i_terraform, airflow) ne sont pas installées hors venv complet.
ignore_missing_imports = True
# cos_service/services/bucketService.py est sinon vu deux fois (sys.path) : "Source file found twice".
explicit_package_bases = True
show_error_codes = True
# Les migrations alembic importent le paquet `alembic`, que le dossier du même nom masque ici.
exclude = (?x)^(alembic/|\.venv|\.venv-tests)
